<!DOCTYPE html>
<html lang="en" layout:decorate="~{admin/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Lịch sử giao ca</title>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet"/>
</head>
<body>
<div layout:fragment="content">
    <main class="content px-3 py-4">
        <div class="container-fluid">
            <div class="mb-3">
                <h3 class="fw-bold fs-4 mb-3">Lịch sử giao ca</h3>
                <div class="row ">
                    <div class="col-12 table-responsive">
                        <table class="table table-striped table-hover" id="example">
                            <thead class="table-dark">
                            <tr>
                                <th scope="col">STT</th>
                                <th scope="col">Mã giao ca</th>
                                <th scope="col">Tên ca</th>
                                <th scope="col">Nhân viên nhận ca</th>
                                <th scope="col">Nhân viên bàn giao</th>
                                <th scope="col">Tổng tiền bàn giao</th>
                                <th scope="col">Số tiền còn thiếu</th>
                                <th scope="col">Tình Trạng</th>
                                <th scope="col">Trạng thái</th>
                                <th scope="col">Chức Năng</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="list, iterStat : ${listGiaoCa}">
                                <td th:text="${iterStat.index + 1}"></td> <!-- STT bắt đầu từ 1 -->
                                <td th:utext="${list.magiaoca}"></td>
                                <td th:utext="${list.tenca}"></td>
                                <td th:utext="${'Mã :'+ list.employee.employeeCode + ' - Tên :'+ list.employee.name + ' - SDT :'+ list.employee.phone}"></td>
                                <td th:utext="${list.nhan_vien_ban_giao}"></td>
                                <td class="currency" th:text="${list.sotienthucnhan}"></td>
                                <td class="currency" th:text="${list.sotienconthieu}"></td>
                                <td th:text="${list.lichSuGiaoCa}"></td>
                                <td>
                                    <span class="rounded-pill btn bg-primary text-white"
                                          th:utext="${list.trang_thai.getDescription()}">
                                    </span>
                                </td>
                                <td>
                                    <span class="icon-wrapper"
                                          style="display: flex; align-items: center; justify-content: center;">
                                         <a class="text-primary" style="text-decoration: none;"
                                            th:href="@{/giaoca/detail/{id}(id=${list.id})}">
                                             <i class="fa-regular fa-eye" style="margin-right: 5px"
                                                aria-hidden="true"
                                                title="Xem chi tiết"></i>

                                         </a>
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        $('#example').DataTable({
            fixedColumns: true,
            layout: {
                topStart: {
                    buttons: ['copy', 'excel', 'pdf', 'colvis']
                }
            }
        });
    </script>
    <script>
        $(document).ready(function() {
            const table = $('#example').DataTable();

            // Format tiền trên trang đầu tiên
            formatAllCurrency();

            // Format tiền khi chuyển trang
            table.on('draw', function() {
                formatAllCurrency();
            });
        });

        // Hàm định dạng lại tất cả các ô có class 'currency'
        function formatAllCurrency() {
            const currencyElements = document.querySelectorAll('.currency');
            currencyElements.forEach(element => {
                const originalValue = parseFloat(element.textContent);
                if (!isNaN(originalValue)) {
                    element.textContent = formatCurrency(originalValue);
                }
            });
        }

        // Hàm định dạng số tiền chỉ với dấu phẩy làm dấu phân cách hàng nghìn
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US').format(value) + " VND"; // Thêm dấu phân cách mà không có đơn vị tiền tệ
        }
    </script>
</div>
</body>
</html>
