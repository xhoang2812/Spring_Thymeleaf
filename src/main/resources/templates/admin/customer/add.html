<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/admin/index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thêm khách hàng mới</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function showErrors(messages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messages
            });
        }

        // Hàm thu thập tên tỉnh, huyện, xã
        function collectAddressNames() {
            const provinceSelect = document.querySelector("#province");
            const districtSelect = document.querySelector("#district");
            const wardSelect = document.querySelector("#ward");

            const provinceName = provinceSelect.options[provinceSelect.selectedIndex].text;
            const districtName = districtSelect.options[districtSelect.selectedIndex].text;
            const wardName = wardSelect.options[wardSelect.selectedIndex].text;

            document.querySelector("#provinceName").value = provinceName;
            document.querySelector("#districtName").value = districtName;
            document.querySelector("#wardName").value = wardName;
        }

        // Hàm kiểm tra và gửi form
        function vali(e) {
            e.preventDefault(); // Ngăn chặn gửi form ngay lập tức

            // Hiển thị hộp thoại xác nhận trước khi thực hiện lưu
            Swal.fire({
                title: 'Bạn có chắc muốn thêm khách hàng mới?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#5ac155',
                cancelButtonColor: '#47434c',
                confirmButtonText: 'Có, thêm ngay!',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {

                    collectAddressNames(); // Gọi hàm để thu thập tên tỉnh, huyện, xã

                    // Lấy giá trị từ các trường trong form
                    let name = document.getElementById('name').value;
                    let dateOfBirth = document.getElementById('dateOfBirth').value;
                    let province = document.getElementById('province').value;
                    let district = document.getElementById('district').value;
                    let ward = document.getElementById('ward').value;
                    let email = document.getElementById('email').value;
                    let phone = document.getElementById('phone').value;
                    let photo = document.getElementById('photo').value;
                    let addressDetails = document.getElementById('addressDetails').value;

                    // Gán giá trị vào các trường ẩn
                    document.getElementById('oldEmail').value = email;
                    document.getElementById('oldPhone').value = phone;

                    // Kiểm tra các trường bắt buộc
                    if (photo === "") {
                        showErrors("Ảnh không được để trống");
                        return;
                    }
                    if (name === "") {
                        showErrors("Tên không được để trống");
                        return;
                    }
                    if (email === "") {
                        showErrors("Email không được để trống");
                        return;
                    }
                    if (dateOfBirth === "") {
                        showErrors("Ngày sinh không được để trống");
                        return;
                    }
                    if (phone === "") {
                        showErrors("Số điện thoại không được để trống");
                        return;
                    }
                    if (province === "") {
                        showErrors("Tỉnh/Thành phố không được để trống");
                        return;
                    }
                    if (district === "") {
                        showErrors("Quận/Huyện không được để trống");
                        return;
                    }
                    if (ward === "") {
                        showErrors("Phường/Xã không được để trống");
                        return;
                    }
                    if (addressDetails === "") {
                        showErrors("Địa chỉ chi tiết không được để trống");
                        return;
                    }
                    if (!/^\d{10}$/.test(phone)) {
                        showErrors("Số điện thoại phải có đúng 10 chữ số");
                        return;
                    }

                    // Kiểm tra định dạng email: phải có '@' và ít nhất 1 dấu '.' sau '@'
                    const emailRegex = /.+@.+\..+/;
                    if (!emailRegex.test(email)) {
                        showErrors("Vui lòng nhập đúng định dạng email");
                        return;
                    }

                    // Kiểm tra tuổi lớn hơn 13
                    const birthDate = new Date(dateOfBirth);
                    const age = new Date().getFullYear() - birthDate.getFullYear();
                    if (age < 13) {
                        showErrors("Tuổi phải lớn hơn hoặc bằng 13");
                        return;
                    }

                    // Kiểm tra trùng lặp
                    axios.get(`/customer/api/customer/check-email?email=${email}`)
                        .then(response => {
                            if (response.data) {
                                showErrors("Email đã tồn tại");
                                return Promise.reject(); // Ngăn không gửi form
                            }
                            return axios.get(`/customer/api/customer/check-phone?phone=${phone}`);
                        })
                        .then(response => {
                            if (response.data) {
                                showErrors("Số điện thoại đã tồn tại");
                                return Promise.reject(); // Ngăn không gửi form
                            }
                            Swal.fire({
                                icon: 'success',
                                title: 'Thêm khách hàng thành công!',
                                text: 'Tài khoản và mật khẩu sẽ được gửi qua email khách hàng.',
                                timer: 2500,
                                showConfirmButton: false
                            }).then(() => {
                                document.getElementById('form').submit(); // Gửi form ở đây
                            });
                        })
                        .catch(error => {
                            if (error) {
                                console.error("Lỗi kiểm tra trùng lặp:", error);
                            }
                        });
                }
            });
        }

        // Hàm tải danh sách tỉnh
        function loadProvinces() {
            if (document.getElementById('province').options.length === 1) {
                return fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/province', {
                    headers: {
                        'Content-Type': 'application/json',
                        'Token': 'e72e960b-9e77-11ef-a35f-3e447ea83dcd'
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        let provinceSelect = document.getElementById('province');
                        provinceSelect.innerHTML = '<option value="">Chọn tỉnh</option>';
                        data.data.forEach(province => {
                            let option = document.createElement('option');
                            option.value = province.ProvinceID;
                            option.text = province.ProvinceName;
                            provinceSelect.add(option);
                        });
                    })
                    .catch(error => console.error('Error fetching provinces:', error));
            }
        }

        function loadingg() {
            loadProvinces();
        }

        // Hàm tải danh sách huyện
        function loadDistricts() {
            let provinceId = document.getElementById('province').value;
            let districtSelect = document.getElementById('district');
            districtSelect.innerHTML = '<option value="">Chọn huyện</option>';
            document.getElementById('ward').innerHTML = '<option value="">Chọn xã</option>';

            if (provinceId) {
                return fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/district', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Token': 'e72e960b-9e77-11ef-a35f-3e447ea83dcd'
                    },
                    body: JSON.stringify({"province_id": parseInt(provinceId)})
                })
                    .then(response => response.json())
                    .then(data => {
                        data.data.forEach(district => {
                            let option = document.createElement('option');
                            option.value = district.DistrictID;
                            option.text = district.DistrictName;
                            districtSelect.add(option);
                        });
                    })
                    .catch(error => console.error('Error fetching districts:', error));
            } else {
                return Promise.resolve();
            }
        }

        // Hàm tải danh sách xã
        function loadWards() {
            let districtId = document.getElementById('district').value;
            let wardSelect = document.getElementById('ward');
            wardSelect.innerHTML = '<option value="">Chọn xã</option>';

            if (districtId) {
                return fetch('https://online-gateway.ghn.vn/shiip/public-api/master-data/ward', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Token': 'e72e960b-9e77-11ef-a35f-3e447ea83dcd'
                    },
                    body: JSON.stringify({"district_id": parseInt(districtId)})
                })
                    .then(response => response.json())
                    .then(data => {
                        data.data.forEach(ward => {
                            let option = document.createElement('option');
                            option.value = ward.WardCode;
                            option.text = ward.WardName;
                            wardSelect.add(option);
                        });
                    })
                    .catch(error => console.error('Error fetching wards:', error));
            } else {
                return Promise.resolve();
            }
        }

        // Thêm sự kiện cho các dropdown
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('province').addEventListener('change', loadDistricts);
            document.getElementById('district').addEventListener('change', loadWards);
            loadingg(); // Gọi hàm để nạp dữ liệu ban đầu
        });
    </script>
    <style>
        .rounded-box {
            border: 1px solid #dee2e6; /* Light border */
            border-radius: 10px; /* Rounded corners */
            padding: 20px; /* Inner spacing */
            margin-bottom: 20px; /* Space between boxes */
            background-color: #f8f9fa; /* Light background */
        }

        .rounded-box h5 {
            text-align: center; /* Center align titles */
            margin-bottom: 1rem; /* Space below title */
        }
    </style>
</head>
<body onload="loadingg()">
<div layout:fragment="content">
    <main class="container px-3 py-4">
        <div class="card">
            <div class="card-body">
                <h3 class="fw-bold fs-4 mb-3">Thêm khách hàng mới</h3>
                <form th:action="@{/customer/save}" method="post" enctype="multipart/form-data"
                      onsubmit="return collectAddressNames()" id="form">
                    <div class="row">
                        <!-- Phần thông tin bên trái -->
                        <div class="col-md-6">
                            <div class="rounded-box">
                                <h5>Thông tin khách hàng</h5>
                                <div class="mb-3">
                                    <label for="customerCode" class="form-label">Mã khách hàng</label>
                                    <input type="text" id="customerCode" name="customerCode" class="form-control"
                                           th:value="${customerCode}" placeholder="Mã khách hàng sẽ tự động tạo"
                                           readonly required>
                                </div>
                                <div class="mb-3">
                                    <label for="photo" class="form-label">Ảnh</label>
                                    <input type="file" id="photo" name="photo" class="form-control" accept="image/*"
                                           required>
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Tên khách hàng</label>
                                    <input type="text" id="name" name="name" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>

                                <!-- Thêm các trường ẩn cho email và số điện thoại -->
                                <input type="hidden" id="oldEmail" name="oldEmail">
                                <input type="hidden" id="oldPhone" name="oldPhone">

                                <div class="mb-3">
                                    <label for="dateOfBirth" class="form-label">Ngày sinh</label>
                                    <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control"
                                           required>
                                </div>
                                <div class="mb-3">
                                    <label for="gender" class="form-label">Giới tính</label>
                                    <select id="gender" name="gender" class="form-select">
                                        <option value="Nam">Nam</option>
                                        <option value="Nữ">Nữ</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="status" class="form-label">Trạng thái</label>
                                    <select id="status" name="status" class="form-select">
                                        <option value="1">Hoạt động</option>
                                        <option value="0">Ngừng hoạt động</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Phần thông tin bên phải -->
                        <div class="col-md-6">
                            <div class="rounded-box">
                                <h5>Thông tin địa chỉ</h5>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Số điện thoại</label>
                                    <input type="text" id="phone" name="phone" class="form-control" required
                                           pattern="\d{10}" title="Vui lòng nhập đúng 10 số">
                                </div>
                                <div class="mb-3">
                                    <label for="province" class="form-label">Tỉnh/ Thành phố</label>
                                    <select id="province" name="province" class="form-select" required>
                                        <option value="">Chọn tỉnh</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="district" class="form-label">Quận/ Huyện</label>
                                    <select id="district" name="district" class="form-select" required>
                                        <option value="">Chọn huyện</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="ward" class="form-label">Phường/ Xã</label>
                                    <select id="ward" name="ward" class="form-select" required>
                                        <option value="">Chọn xã</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="addressDetails" class="form-label">Địa chỉ chi tiết</label>
                                    <input type="text" id="addressDetails" name="addressDetails" class="form-control"
                                           placeholder="Số nhà, đường..." required>
                                </div>
                                <!-- Các trường ẩn chứa tên tỉnh/huyện/xã -->
                                <input type="hidden" id="provinceName" name="provinceName">
                                <input type="hidden" id="districtName" name="districtName">
                                <input type="hidden" id="wardName" name="wardName">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success" onclick="vali(event)">Lưu</button>
                    <a href="/customer/display" class="btn btn-secondary">Hủy</a>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
