<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/admin/index">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" href="/css/bill.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script src="/js/af.min.js"></script>
    <script src="/js/Bill.js" defer></script>
</head>
<body>
<div class="container my-5" layout:fragment="content">

    <div class="row mb-12">
        <div class="col-md-12">
            <div aria-label="Basic radio toggle button group">
                <!-- Mới nhất -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio1" autocomplete="off" checked>
                <label onclick="getBills(10)" class="btn btn-outline-secondary" for="btnradio1">Tất cả</label>

                <!-- Chờ xác nhận -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio2" autocomplete="off">
                <label onclick="getBills(0)" class="btn btn-outline-secondary" for="btnradio2">Chờ xác nhận</label>

                <!-- Chờ đóng gói -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio3" autocomplete="off">
                <label onclick="getBills(1)" class="btn btn-outline-secondary" for="btnradio3">Chờ đóng gói</label>

                <!-- Chờ vận chuyển -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio4" autocomplete="off">
                <label onclick="getBills(2)" class="btn btn-outline-secondary" for="btnradio4">Chờ vận chuyển</label>

                <!-- Đang vận chuyển -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio5" autocomplete="off">
                <label onclick="getBills(3)" class="btn btn-outline-secondary" for="btnradio5">Đang vận chuyển</label>

                <!-- Đã nhận hàng -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio6" autocomplete="off">
                <label onclick="getBills(4)" class="btn btn-outline-secondary" for="btnradio6">Đã nhận hàng</label>

                <!-- Hoàn tất -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio7" autocomplete="off">
                <label onclick="getBills(5)" class="btn btn-outline-secondary" for="btnradio7">Hoàn tất</label>

                <!-- Trả hàng -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio8" autocomplete="off">
                <label onclick="getBills(7)" class="btn btn-outline-secondary" for="btnradio8">Chờ hoàn tiền</label>

                <input type="radio" class="btn-check" name="orderStatus" id="btnradio10" autocomplete="off">
                <label onclick="getBills(14)" class="btn btn-outline-secondary" for="btnradio10">Đã trả hàng</label>

                <!-- Hủy -->
                <input type="radio" class="btn-check" name="orderStatus" id="btnradio9" autocomplete="off">
                <label onclick="getBills(-1)" style="width: 200px" class="btn btn-outline-secondary" for="btnradio9">Hủy</label>
            </div>
        </div>

        <label style="margin-top: 20px;width: 350px">
            Tìm kiếm:
            <input type="search" id="keyWord" onchange="getBills(11)" class="form-control"
                   placeholder="Tìm kiếm hóa đơn...">
        </label>

        <input type="checkbox" checked class="btn-check" onchange="getBills(11)" name="orderStatus" id="btnradio11" autocomplete="off">
        <label   style="width: 50px;height: 33px;align-content: initial;margin-top: 40px;margin-bottom: 0" class="btn btn-outline-secondary" for="btnradio11">Mới nhất</label>

        <label style="margin-top: 20px;width: 190px">
            Từ:
            <input type="number" min="0" id="minPrice" value="0" onchange="getBills(11)" class="form-control"
                   placeholder="Nhập số tiền nhỏ">
        </label>
        <label style="margin-top: 20px;width: 180px">
            Đến:
            <input type="number" min="0" id="maxPrice" value="5000000000" onchange="getBills(11)" class="form-control"
                   placeholder="Nhập số tiền lớn">
        </label>
        <label style="margin-top: 20px;width: 200px;">
            Sau <input type="datetime-local" id="dateStart" onchange="getBills(11)" class="form-control">
        </label>
        <label style="margin-top: 20px;width: 200px">
            Trước <input type="datetime-local" id="dateEnd" onchange="getBills(11)" class="form-control">
        </label>
        <select id="select-date" onchange="selectDate()" style="width: 110px;height: 35px;margin-top: 40px" class="form-select">
            <option value="0" selected>Hôm nay</option>
            <option value="1">2 ngày qua</option>
            <option value="2">7 ngày qua</option>
            <option value="3">30 ngày qua</option>
            <option value="4">90 ngày qua</option>
        </select>
    </div>
    <div class="row mt-5">

        <!-- Header -->
        <!-- Danh sách đơn hàng -->
        <div class="col-md-4 order-summary"
             style="height: 630px; overflow-y: auto; background-color: #f9f9f9; border-radius: 8px; padding: 10px;">
        </div>

        <!-- Chi tiết đơn hàng -->


        <div class="col-md-8 order-details">
            <div class="no-bill-selected">
                <p style="text-align: center; font-size: 18px; color: gray;">
                    Chọn hóa đơn
                </p>
            </div>
            <div class="order-summary-details" style="display: none;">
                <!-- Nội dung bảng chi tiết hóa đơn như bạn đã đưa -->
            </div>
        </div>
    </div>
    <!-- Modal Lịch Sử -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="historyModalLabel">Lịch sử hóa đơn</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto">
                    <table class="table table-striped table-bordered">
                        <thead style="position: sticky;top: -20px;background-color: white; z-index: 1;">
                        <tr>
                            <th>STT</th>
                            <th>Nhân viên</th>
                            <th>Thời gian</th>
                            <th>Chuyển từ</th>
                            <th>Sang</th>
                            <th>Mô tả</th>
                        </tr>
                        </thead>
                        <tbody id="historyTableBody">
                        <!-- Dữ liệu sẽ được render vào đây -->
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
