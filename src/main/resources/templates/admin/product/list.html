<!DOCTYPE html>
<html lang="en" layout:decorate="~{admin/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet"/>
</head>

<body onload="checkUser()">
<div layout:fragment="content">
    <main class="content px-3 py-4">
        <div class="container-fluid">
            <div class="mb-3">
                <h3 class="fw-bold fs-4 mb-3">Danh sách sản phẩm</h3>
                <div class="row">
                    <div class="col-6 mb-2" style="text-align:start">
                        <a class="btn btn-secondary" th:href="@{/san-pham-chi-tiet/hien-thi}">
                            Danh sách sản phẩm chi tiết
                        </a>
                    </div>
                    <div class="col-6 mb-2" style="text-align:end">
                        <a id="i-1" class="btn btn-secondary" th:href="@{/san-pham/create}">
                            Thêm mới
                        </a>
                    </div>
                    <div>
                        <button aria-controls="collapseExample" aria-expanded="false" class="btn btn-primary"
                                data-bs-target="#collapseExample" data-bs-toggle="collapse" type="button">
                            Lọc theo thuộc tính  <i class="fa-solid fa-filter"></i>
                        </button>
                        <div class="collapse" id="collapseExample">
                            <div class="card card-body">
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="filterCategory">Danh mục:</label>
                                        <select class="form-select" id="filterCategory">
                                            <option value="">Tất cả</option>
                                            <option th:each="category : ${categories}" th:text="${category.name}"
                                                    th:value="${category.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filterMaterial">Chất liệu:</label>
                                        <select class="form-select" id="filterMaterial">
                                            <option value="">Tất cả</option>
                                            <option th:each="material : ${materials}" th:text="${material.name}"
                                                    th:value="${material.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filterBrand">Thương hiệu:</label>
                                        <select class="form-select" id="filterBrand">
                                            <option value="">Tất cả</option>
                                            <option th:each="brand : ${brands}" th:text="${brand.name}"
                                                    th:value="${brand.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="filterStyle">Kiểu dáng:</label>
                                        <select class="form-select" id="filterStyle">
                                            <option value="">Tất cả</option>
                                            <option th:each="style : ${styles}" th:text="${style.name}"
                                                    th:value="${style.name}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <table class="table table-striped table-hover" id="example">
                            <thead class="table-dark">
                            <tr>
                                <th scope="col">Tên</th>
                                <th scope="col">Giới tính</th>
                                <th scope="col">Danh mục</th>
                                <th scope="col">Chất liệu</th>
                                <th scope="col">Thương hiệu</th>
                                <th scope="col">Kiểu dáng</th>
                                <th scope="col">Tổng số lượng </th>
                                <th scope="col">Trạng thái</th>
                                <th scope="col">Chức Năng</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="list : ${listProduct}">
                                <td th:utext="${list.name}"></td>
                                <td th:utext="${list.gender}"></td>
                                <td th:utext="${list.category}"></td>
                                <td th:utext="${list.material}"></td>
                                <td th:utext="${list.brand}"></td>
                                <td th:utext="${list.style}"></td>
                                <td th:utext="${#numbers.formatDecimal(list.sumQuantity, 0, 'DEFAULT', 0, 'DEFAULT')+ ' cái'}"></td>

                                <td>
                                    <span
                                            class="badge bg-success"
                                            th:id="'trangThaiUpdate_'+${list.id}"
                                            th:if="${list.status == 1}">Hoạt Động
                                    </span>
                                    <span
                                            class="badge bg-danger"
                                            th:id="'trangThaiUpdate_'+${list.id}"
                                            th:if="${list.status == 0}">Ngừng Hoạt Động
                                    </span>
                                </td>
                                <td style="display: flex; align-items: center;">
                                    <a id="i-2" th:href="@{/san-pham/update/{id}(id=${list.id})}">
                                        <i class="fa-solid fa-wrench"></i>
                                    </a>
                                    <a class="form-check form-switch ms-2">
                                        <input id="i-3" class="form-check-input" onchange="capNhatLaiDuLieu(this)"
                                               onclick="capNhatTrangThai(this.getAttribute('data-ma'))"
                                               role="switch"
                                               th:checked="${list.status == 1}"
                                               th:data-ma="${list.id}"
                                               type="checkbox">
                                        <input style="display: none" th:id="'btnDoiTrangThai_' + ${list.id}"
                                               th:value="${list.status}">
                                    </a>
                                    <a th:href="@{/san-pham-chi-tiet/detail-by-id-product/{idProduct}(idProduct=${list.id})}">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        $('#example').DataTable({
            fixedColumns: true,
            order: [],
            layout: {
                topStart: {
                    buttons: ['copy', 'excel', 'pdf', 'colvis']
                }
            }
        });
        $(document).ready(function () {
            var table = $('#example').DataTable();

            function removeDiacritics(str) {
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            }

            // Function to apply custom filtering
            $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
                var category = removeDiacritics($('#filterCategory').val()); // Xóa dấu từ bộ lọc
                var material = removeDiacritics($('#filterMaterial').val());
                var brand = removeDiacritics($('#filterBrand').val());
                var style = removeDiacritics($('#filterStyle').val());

                console.log(style)
                var rowCategory = data[2]; // Cột "Danh mục"
                var rowMaterial = data[3]; // Cột "Chất liệu"
                var rowBrand = data[4]; // Cột "Thương hiệu"
                var rowStyle = data[5]; // Cột "Kiểu dáng"
                console.log(rowStyle)
                // Kiểm tra nếu bộ lọc không rỗng và dữ liệu phải khớp
                if ((category === '' || rowCategory.includes(category)) &&
                    (material === '' || rowMaterial.includes(material)) &&
                    (brand === '' || rowBrand.includes(brand)) &&
                    (style === '' || rowStyle.includes(style))) {
                    return true;
                }
                return false;
            });

            // Khi thay đổi giá trị của dropdown, áp dụng lại filter
            $('#filterCategory, #filterMaterial, #filterBrand, #filterStyle').on('change', function () {
                table.draw();
            });
        });
    </script>
    <script>
        function showErrors(messsages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messsages
            });
        }

        function showSuccesss(messages) {
            Swal.fire({
                title: messages,
                icon: "success"
            });
        }

        [[${createSuccess} == true]] ? showSuccesss("Thêm thành công") : '';
        [[${updateSuccess} == true]] ? showSuccesss("Sửa thành công") : '';
    </script>
    <script>
        function checkUser(){
            $.ajax({
                url: "/api/vouchers/userData",
                method: "GET",
                success: function (data) {
                    console.log(data)
                    if (data === "") {
                        document.querySelectorAll("#i-1").forEach(i => i.remove());
                        document.querySelectorAll("#i-2").forEach(i => i.remove());
                        document.querySelectorAll("#i-3").forEach(i => i.remove());
                    }
                },
                error: function (error) {
                    console.log(error)
                }
            })
        }
        function capNhatTrangThai(id) {
            idMau = id;
            let trangThai = document.getElementById("btnDoiTrangThai_" + id).value;
            var formData = new FormData();
            formData.append("trangThai", trangThai);
            $.ajax({
                type: "PUT",
                url: "/san-pham/change-status/" + id,
                data: formData,
                contentType: false,
                processData: false,
                success: function (response) {
                    Swal.fire({
                        title: "Cập nhật trạng thái thành công!",
                        icon: "success"
                    })
                },
                error: function (error) {
                    console.log("Error1: " + JSON.stringify(error));
                }
            });
        }

        function capNhatLaiDuLieu(checkbox) {
            let trangThai = checkbox.checked;
            let tThai = document.getElementById("trangThaiUpdate_" + idMau);
            if (trangThai) {
                tThai.innerText = "Hoạt Động";
                tThai.style.color = "white";
                tThai.classList.remove("badge", "bg-danger");
                tThai.classList.add("badge", "bg-success");
            } else {
                tThai.innerText = "Không Hoạt Động";
                tThai.style.color = "white";
                tThai.classList.remove("badge", "bg-success");
                tThai.classList.add("badge", "bg-danger");
            }
        }
    </script>
</div>
</body>
</html>
