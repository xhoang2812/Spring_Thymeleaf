<!DOCTYPE html>
<html lang="en" layout:decorate="~{admin/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.show {
            opacity: 1;
        }
    </style>
    <script defer>
        function loading(){
            setTimeout(() => {
                $.ajax({
                    url: "/api/vouchers/userData",
                    method: "GET",
                    success: function (data) {
                        console.log(data)
                        if (data === "") {
                            sessionStorage.setItem("notificationForMap","Bạn không phải là Admin");
                            window.location.href = "/";
                        }else {
                            document.body.classList.add('show');
                        }
                    },
                    error: function (error) {
                        console.log(error)
                    }
                })
            }, 300);
        }
    </script>
</head>
<body onload="loading()">
<div class="card container" layout:fragment="content" style=" box-shadow: 0px 0px 3px gray">
    <div class="card-header">
        <div style="text-align: center">
            <h3>Sửa sản phẩm</h3>
        </div>
    </div>
    <div class="card-body">
        <form class="row" onsubmit="return valid(event)" th:action="@{/san-pham/edit/{id}(id=${data.id})}" th:method="POST"
              th:object="${data}" th:id="form-add">
            <div class="col-3 mb-3">
                <label class="form-label">Mã sản phẩm</label>
                <input class="form-control" th:value="*{code}" th:readonly="true">
            </div>
            <div class="col-3 mb-3">
                <label class="form-label">Tên sản phẩm</label>
                <input class="form-control" th:field="*{name}" type="text" th:id="nameSP">
            </div>
            <div class="col-3 mb-3">
                <label class="form-label">Trạng thái</label>
                <select class="form-select" th:field="*{status}"  style="height: 40px">
                    <option th:value="1">Hoạt động</option>
                    <option th:value="0">Ngừng hoạt động</option>
                </select>
            </div>
            <div class="col-3 mb-3">
                <label class="form-label">Giới tính</label>
                <select class="form-select" style="height: 41px" th:field="*{gender}">
                    <option th:value="Nam">Nam</option>
                    <option th:value="Nữ">Nữ</option>
                    <option th:value="Unisex">Unisex</option>
                </select>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Mô tả</label>
                <textarea class="form-control" th:field="*{description}" type="text" th:id="moTaSP"></textarea>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Kiểu dáng</label>
                <select class="form-select" th:field="*{style}">
                    <option th:each="list : ${listStyle}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label  class="form-label">Chất liệu</label>
                <select class="form-select" th:field="*{material}">
                    <option th:each="list : ${listMaterial}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Danh mục</label>
                <select class="form-select" th:field="*{category}">
                    <option th:each="list : ${listCategory}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Thương hiệu</label>
                <select class="form-select" th:field="*{brand}">
                    <option th:each="list : ${listBrand}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Ngày tạo</label>
                <input class="form-control"  th:value="*{dateCreate}" th:readonly="true">
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Ngày sửa</label>
                <input class="form-control"  th:value="*{dateUpdate}" th:readonly="true">
            </div>
            <div class="mt-3" style="text-align: center">
                <button class="btn btn-dark" type="submit">Sửa</button>
                <a class="btn btn-dark" th:href="@{/san-pham/hien-thi}">Quay lại</a>
            </div>
        </form>
    </div>
    <script>
        async function valid(event) {
            event.preventDefault();
            const nameSPField = document.getElementById('nameSP');
            const nameSPValue = nameSPField.value.trim();
            const moTaSPField = document.getElementById('moTaSP');
            const moTaSPValue = moTaSPField.value.trim();
            let isValid = true;

            if (nameSPValue === "") {
                showErrors("Tên sản phẩm không được để trống!");
                nameSPField.focus();
                isValid = false;
            } else if (moTaSPValue === "") {
                showErrors("Mô tả sản phẩm không được để trống!");
                moTaSPField.focus();
                isValid = false;
            }

            if (isValid) {
                const result = await Swal.fire({
                    title: 'Bạn có chắc chắn muốn hoàn thành?',
                    text: "Hành động này không thể hoàn tác!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Đồng ý',
                    cancelButtonText: 'Hủy'
                });

                if (result.isConfirmed) {
                    document.getElementById('form-add').submit();
                } else {
                    console.log('User canceled the submission.');
                    return false; // Prevent form submission
                }
            }
        }
    </script>
    <script>
        function showErrors(messsages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messsages
            });
        }

        function showSuccesss(messages){
            Swal.fire({
                title: messages,
                icon: "success"
            });
        }

        [[${tenTonTai} == true]] ? showErrors('Tên sản phẩm đã tồn tại!') : '';
        [[${maTonTai} == true]] ? showErrors('Mã sản phẩm đã tồn tại!') : '';
    </script>
</div>
</body>
</html>
