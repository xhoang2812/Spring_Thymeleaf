<!DOCTYPE html>
<html lang="en" layout:decorate="~{admin/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm chi tiết</title>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet"/>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.show {
            opacity: 1;
        }
    </style>
    <script defer>
        function loading(){
            setTimeout(() => {
                $.ajax({
                    url: "/api/vouchers/userData",
                    method: "GET",
                    success: function (data) {
                        console.log(data)
                        if (data === "") {
                            sessionStorage.setItem("notificationForMap","Bạn không phải là Admin");
                            window.location.href = "/";
                        }else {
                            document.body.classList.add('show');
                        }
                    },
                    error: function (error) {
                        console.log(error)
                    }
                })
            }, 300);
        }
    </script>
</head>
<body onload="loading()">
<div class="card container" layout:fragment="content">
    <div class="card-header">
        <div style="text-align: center">
            <h3>Sửa sản phẩm chi tiết </h3>
        </div>
    </div>
    <div class="card-body">
        <form enctype="multipart/form-data" class="row" onsubmit="return valid(event)" th:action="@{/san-pham-chi-tiet/edit/{id}(id=${productVariantDetail.id})}"
              th:method="POST" th:id="form-add"
              th:object="${productVariantDetail}">
            <input name="idImage" th:value="*{image.id}" type="hidden">
            <div class="col-6 mb-3">
                <label class="label-control">Sản phẩm</label>
                <select class="form-control" th:field="*{product}" th:disabled="true">
                    <option th:each="list : ${listProduct}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="label-control">Trạng thái</label>
                <select class="form-control" th:field="*{status}">
                    <option th:value="1">Hoạt động</option>
                    <option th:value="0">Ngừng hoạt động</option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="label-control">Kích thước</label>
                <select class="form-control" th:field="*{size}">
                    <option th:each="list : ${listSize}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-6 mb-3">
                <label class="label-control">Màu sắc</label>
                <select class="form-control" th:field="*{color}">
                    <option th:each="list : ${listColor}" th:utext="${list.name}" th:value="${list.id}"></option>
                </select>
            </div>
            <div class="col-4 mb-3">
                <label class="label-control">Số lượng</label>
                <input class="form-control" th:field="*{quantity}" th:id="spctSoLuong" type="text">
            </div>
            <div class="col-4 mb-3">
                <label class="label-control">Giá</label>
                <input class="form-control" th:field="*{price}" th:id="spctGia" type="text">
            </div>
            <div class="col-4 mb-3">
                <label class="label-control">Trọng lượng</label>
                <input class="form-control" th:field="*{weight}" th:id="spctTrongLuong" type="text">
            </div>

            <div class="col-3 mb-3">
                <label class="label-control">Ngày tạo</label>
                <input class="form-control" th:readonly="true" th:value="${productVariantDetail.dateCreate}"
                       type="text">
            </div>
            <div class="col-3 mb-3">
                <label class="label-control">Ngày sửa</label>
                <input class="form-control" th:readonly="true" th:value="${productVariantDetail.dateUpdate}"
                       type="text">
            </div>
            <div class="col-6 mb-3">
                <label class="label-control">Thêm ảnh mới</label>
                <div class="row">
                    <div class="col-4">
                        <input class="form-control" id="avatarFile1" th:name="imgProduct1" type="file">
                    </div>
                    <div class="col-4">
                        <input class="form-control" id="avatarFile2" th:name="imgProduct2" type="file">
                    </div>
                    <div class="col-4">
                        <input class="form-control" id="avatarFile3" th:name="imgProduct3" type="file">
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-sm-6 col-6">
                <label class="form-label">Ảnh chi tiết</label>
                <div class="row">
                    <div class="col-4">
                        <img alt="Ảnh sản phẩm 1" style="width: 203px; height: 200px;"
                             th:src="@{'/san-pham-chi-tiet/test/' + *{image.url1}}">
                    </div>
                    <div class="col-4">
                        <img alt="Ảnh sản phẩm 2" style="width: 203px; height: 200px;"
                             th:src="@{'/san-pham-chi-tiet/test/' + *{image.url2}}">
                    </div>
                    <div class="col-4">
                        <img alt="Ảnh sản phẩm 3" style="width: 203px; height: 200px;"
                             th:src="@{'/san-pham-chi-tiet/test/' + *{image.url3}}">
                    </div>
                </div>
            </div>

            <div class=" col-lg-6 col-sm-6 col-6">
                <label class="form-label">Ảnh được chọn để sửa</label>
                <div class="row">
                    <div class="col-4">
                        <img id="avatarPreview1" style="width: 200px; height: 200px; display: none">
                    </div>
                    <div class="col-4">
                        <img id="avatarPreview2" style="width: 200px; height: 200px; display: none">
                    </div>
                    <div class="col-4">
                        <img id="avatarPreview3" style="width: 200px; height: 200px; display: none">
                    </div>
                </div>

            </div>
            <div class="mt-3" style="text-align: center">
                <button class="btn btn-dark" type="submit">Sửa</button>
                <a class="btn btn-dark" th:href="@{/san-pham-chi-tiet/hien-thi}">Quay lại</a>
            </div>
        </form>
    </div>
    <script>
        $(document).ready(() => {
            const avatarFiles = [
                {fileInput: $("#avatarFile1"), preview: $("#avatarPreview1")},
                {fileInput: $("#avatarFile2"), preview: $("#avatarPreview2")},
                {fileInput: $("#avatarFile3"), preview: $("#avatarPreview3")}
            ];

            avatarFiles.forEach(({fileInput, preview}) => {
                fileInput.change(function (e) {
                    const file = e.target.files[0];
                    if (file) {
                        const imgURL = URL.createObjectURL(file);
                        preview.attr("src", imgURL).css("display", "block");

                        // Giải phóng URL khi không cần nữa
                        preview.on('load', () => {
                            URL.revokeObjectURL(imgURL);
                        });
                    }
                });
            });
        });
    </script>
    <script>
        function showErrors(messsages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messsages
            });
        }

        function showSuccesss(messsages1) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "success",
                title: messsages1
            });
        }

        async function valid(event) {
            event.preventDefault();

            const quantityField = document.getElementById('spctSoLuong');
            const priceField = document.getElementById('spctGia');
            const weightField = document.getElementById('spctTrongLuong');

            var file1 = document.getElementById('avatarFile1').files.length;
            var file2 = document.getElementById('avatarFile2').files.length;
            var file3 = document.getElementById('avatarFile3').files.length;

            const quantityValue = quantityField.value.trim();
            const priceValue = priceField.value.trim();
            const weightValue = weightField.value.trim();

            const MAX_INT = 2147483647;  // Giá trị lớn nhất của int
            const MAX_DOUBLE = 1.7976931348623157e+308; // Giá trị lớn nhất của double

            let isValid = true;

            if ((file1 > 0 || file2 > 0 || file3 > 0) && (file1 === 0 || file2 === 0 || file3 === 0)) {
                showErrors("Nếu đã chọn một ảnh, bạn cần chọn đủ cả 3 ảnh.");
                if (file1 === 0) {
                    document.getElementById('avatarFile1').focus();
                } else if (file2 === 0) {
                    document.getElementById('avatarFile2').focus();
                } else {
                    document.getElementById('avatarFile3').focus();
                }
                isValid = false; // Ngăn chặn form submit
            }

            if (!quantityValue) {
                showErrors("Số lượng không được để trống!");
                quantityField.focus();
                isValid = false;
            } else if (isNaN(quantityValue) || Number(quantityValue) < 0) {
                showErrors("Số lượng phải là số nguyên dương!");
                quantityField.focus();
                isValid = false;
            } else if (Number(quantityValue) > MAX_INT) {
                showErrors("Số lượng quá lớn!");
                quantityField.focus();
                isValid = false;
            }

            if (!priceValue) {
                showErrors("Đơn giá không được để trống!");
                priceField.focus();
                isValid = false;
            } else if (isNaN(priceValue) || Number(priceValue) < 0) {
                showErrors("Đơn giá phải là một số dương!");
                priceField.focus();
                isValid = false;
            } else if (Number(priceValue) > MAX_DOUBLE) {
                showErrors("Đơn giá quá lớn!");
                priceField.focus();
                isValid = false;
            }

            if (!weightValue) {
                showErrors("Trọng lượng không được để trống!");
                weightField.focus();
                isValid = false;
            } else if (isNaN(weightValue) || Number(weightValue) < 0) {
                showErrors("Trọng lượng phải là một số dương!");
                weightField.focus();
                isValid = false;
            } else if (Number(weightValue) > MAX_DOUBLE) {
                showErrors("Trọng lượng quá lớn!");
                weightField.focus();
                isValid = false;
            }

            if (isValid) {
                const result = await Swal.fire({
                    title: 'Bạn có chắc chắn muốn hoàn thành?',
                    text: "Hành động này không thể hoàn tác!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Đồng ý',
                    cancelButtonText: 'Hủy'
                });

                if (result.isConfirmed) {
                    document.getElementById('form-add').submit();
                } else {
                    console.log('User canceled the submission.');
                    return false; // Prevent form submission
                }
            }
        }
    </script>
</div>
</body>
</html>
