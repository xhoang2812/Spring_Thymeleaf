
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function showErrors(messages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messages
            });
        }

        function vali(e) {
            e.preventDefault(); // Ngăn chặn gửi form ngay lập tức

            // Lấy giá trị từ các trường trong form
            let username = document.getElementById('username').value;
            let currentPassword = document.getElementById('currentPassword').value;
            let newPassword = document.getElementById('newPassword').value;
            let confirmPassword = document.getElementById('confirmPassword').value;

            // Kiểm tra các trường bắt buộc
            if (username === "") {
                showErrors("Username không được để trống");
                return;
            }
            if (currentPassword === "") {
                showErrors("Mật khẩu hiện tại không được để trống");
                return;
            }
            if (newPassword === "") {
                showErrors("Mật khẩu mới không được để trống");
                return;
            }
            if (newPassword !== confirmPassword) {
                showErrors("Mật khẩu mới và xác nhận mật khẩu không khớp!");
                return;
            }

            // Kiểm tra tồn tại username trước khi kiểm tra mật khẩu
            axios.get(`/login/api/check-username?username=${username}`)
                .then(response => {
                    if (!response.data) {
                        showErrors("Username không tồn tại");
                        return Promise.reject(); // Ngăn không gửi form
                    }

                    // Kiểm tra mật khẩu hiện tại
                    return axios.get('/login/api/check-current-password', {
                        params: {
                            username: username,
                            currentPassword: currentPassword
                        }
                    });
                })
                .then(response => {
                    if (!response.data) {
                        showErrors("Mật khẩu hiện tại không đúng");
                        return Promise.reject(); // Ngăn không gửi form
                    }
                    Swal.fire({
                        icon: 'success',
                        title: 'Đổi mật khẩu thành công!',
                        text: 'Mật khẩu mới của bạn đã được cập nhật.',
                        timer: 2500,
                        showConfirmButton: false
                    }).then(() => {
                        document.getElementById('form').submit(); // Gửi form ở đây
                    });
                })
                .catch(error => {
                    console.error("Lỗi kiểm tra hoặc đổi mật khẩu:", error);
                });
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f7;
        }
        .reset-container {
            display: flex;
            width: 900px;
            height: 450px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .reset-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .reset-form h2 {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .btn-reset {
            background-color: #4CAF50;
            color: white;
        }
        .info-section {
            flex: 1;
            background-color: #1f4c38;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .info-section h2 {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-register {
            background-color: white;
            color: #1f4c38;
            border: 2px solid white;
            font-weight: bold;
        }
        .forgot-password-container {
            display: flex;
            justify-content: space-between;
        }

        .forgot-password {
            margin-right: 10px;
        }

        .forgot-password a {
            text-decoration: none;
            color: #007bff;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
        .forgot-password {
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>
<body>
<form th:action="@{/login/change-password}" method="post" id="form">
    <div class="reset-container">
        <!-- Reset Form Section -->
        <div class="reset-form">
            <h2>Đổi mật khẩu</h2>
            <input type="text" id="username" name="username" class="form-control" placeholder="Tài khoản" >
            <input type="password" id="currentPassword" name="currentPassword" class="form-control" placeholder="Mật khẩu hiện tại" >
            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Mật khẩu mới" >
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Xác nhận mật khẩu mới" >
            <div class="forgot-password-container">
                <div class="forgot-password">
                    <a href="/login">Quay lại trang đăng nhập</a>
                </div>
                <div class="forgot-password">
                    <a href="/login/forgot-password">Quên mật khẩu?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-reset w-100 mt-3" onclick="vali(event)">Cập nhật mật khẩu</button>
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <h2>F6 Store xin chào!</h2>
            <p>Hãy nhập đúng username và password để đổi mật khẩu.</p>
            <a th:href="@{/login/register}" class="btn btn-register w-50 mt-3">Đăng ký</a>
        </div>
    </div>
</form>

</body>
</html>
