            function populateYearSelect(selectId) {
                const selectElement = document.getElementById(selectId);
                for (let i = 0; i < 5; i++) {
                    const year = currentYear - i;
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year;
                    selectElement.appendChild(option);

        // js bieu do s nam
        // Hàm tính toán chênh lệch và % thay đổi
        const calculateChanges = (value1, value2) => {
            const diff = value2 - value1;
            const percentChange = value1 !== 0 ? (diff / value1) * 100 : 0;

            const diffSign = diff > 0 ? '+' : ''; // Dấu "+" cho giá trị dương
            const percentSign = diff > 0 ? '+' : '-'; // Chọn "tăng" hoặc "giảm"

            return {
                diff: `${diffSign}${diff}`, // Sự chênh lệch
                percent: `${percentSign} ${Math.abs(percentChange).toFixed(2)}%` // % thay đổi
            };
        };

                labels: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'],
                datasets: [],
            },
            options: {
                responsive: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (tooltipItem) => {
                                const index = tooltipItem.dataIndex;

                                const datasetIndex = tooltipItem.datasetIndex;
                                const otherDatasetIndex = datasetIndex === 0 ? 1 : 0;

                                const currentValue = lineChart.data.datasets[datasetIndex].data[index];
                                const otherValue = lineChart.data.datasets[otherDatasetIndex].data[index];

                                const {diff, percent} = calculateChanges(otherValue, currentValue);
                                const formatter = new Intl.NumberFormat('vi-VN'); // Định dạng theo chuẩn Việt Nam
                                return [
                                    `${lineChart.data.datasets[datasetIndex].label}: ${formatter.format(currentValue)} VND`,
                                    `${lineChart.data.datasets[otherDatasetIndex].label}: ${formatter.format(otherValue)} VND`,
                                    `Chênh lệch: ${formatter.format(diff)} VND`,
                                    `Tỷ lệ: ${percent}`,
                                ];
                            },
                        },
                    },
                    title: {
                        display: true,
                        text: 'So sánh dữ liệu giữa hai năm',
                    },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Doanh thu (VND)', // Nhãn cho trục Y
                        },
                    },
                },
            },
        });

        function updateChart() {
            const year1 = document.getElementById('year1-select').value;
            const year2 = document.getElementById('year2-select').value;

            const request1 = $.ajax({
                url: `/api/statistical/getDT?year=${year1}`,
                method: "GET",
            });

            const request2 = $.ajax({
                url: `/api/statistical/getDT?year=${year2}`,
                method: "GET",
            });

            // Đợi cả hai request hoàn tất
            Promise.all([request1, request2])
                .then(([data1, data2]) => {
                    // Gán dữ liệu và cập nhật biểu đồ
                    lineChart.data.datasets = [
                        {
                            label: `Năm ${year1}`,
                            data: data1,
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            fill: false,
                            tension: 0.1,
                        },
                        {
                            label: `Năm ${year2}`,
                            data: data2,
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            fill: false,
                            tension: 0.1,
                        },
                    ];

                    lineChart.update(); // Cập nhật biểu đồ
                })
                .catch((error) => {
                    console.error("Lỗi khi lấy dữ liệu:", error);
                });
        }

        // Khởi tạo dữ liệu mặc định
        // document.getElementById('year1-select').value = 2020;
        document.getElementById('year1-select').value = 2024;
        document.getElementById('year2-select').value = 2025;
        updateChart();

        // bieu do theo thang theo ngay
        let revenueChart; // Khai báo biến toàn cục để lưu trữ biểu đồ

        function bieuDoMoi(month, year) {
            console.log(month, year);

            // // Tạo mảng nhãn 'Ngày 1', 'Ngày 2', ..., 'Ngày 31'
            // let days = Array.from({ length: 31 }, (_, i) => `Ngày ${i + 1}`);
            // let revenues = []; // Mảng doanh thu sẽ được cập nhật từ API
            const daysInMonth = new Date(year, month, 0).getDate(); // Lấy số ngày của tháng

            // Tạo mảng nhãn dạng 'Ngày DD-MM-YYYY'
            let days = Array.from({length: daysInMonth}, (_, i) => `Ngày ${i + 1}-${month}-${year}`);
            let revenues = []; // Mảng doanh thu sẽ được cập nhật từ API
            // Gọi API để lấy dữ liệu doanh thu
            $.ajax({
                url: "/api/statistical/getDtForMonth" + "?month=" + month + "&year=" + year,
                method: "GET",
                success: function (data) {
                    // Giả định `data` trả về mảng doanh thu tương ứng với các ngày trong tháng
                    revenues = data;

                    const ctx2 = document.getElementById('revenueChart').getContext('2d');

                    // Hủy biểu đồ cũ nếu tồn tại
                    if (revenueChart) {
                        revenueChart.destroy();
                    }

                    // Tạo biểu đồ mới
                    revenueChart = new Chart(ctx2, {
                        type: 'bar', // Loại biểu đồ
                        data: {
                            labels: days, // Ngày trong tháng
                            datasets: [{
                                label: 'Doanh thu (VND)',
                                data: revenues, // Doanh thu theo từng ngày
                                backgroundColor: 'rgba(75, 192, 192, 0.5)', // Màu cột
                                borderColor: 'rgba(75, 192, 192, 1)', // Màu viền
                                borderWidth: 1 // Độ dày viền
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: true, // Hiển thị chú thích
                                    position: 'top'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            // Định dạng doanh thu: Thêm dấu ',' và 'VND'
                                            return context.raw.toLocaleString() + ' VND';
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Ngày'
                                    }
                                },
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Doanh thu (VND)'
                                    }
                                }
                            }
                        }
                    });
                },
                error: function (error) {
                    console.error("Lỗi khi gọi API: ", error);
                }
            });
        }

        bieuDoMoi(1, 2025);

        function hehe() {
            const hehe = document.getElementById("monthPicker2").value
            const dateStr = hehe; // Chuỗi ngày tháng
            const [year, month] = dateStr.split('-');
            console.log(dateStr[month]); // Output: Năm: 2023
            console.log(`${month}`); // Output: Tháng: 12
            bieuDoMoi(month, year);
            console.log(hehe)
        }


        $.ajax({
            url: `http://localhost:8080/api/statistical/tiletrangthaidonhang`,
            method: "GET",
            success: function (data) {
                const orderStatusData = {
                    labels: ['Hoàn thành đơn', 'Hủy đơn'],
                    datasets: [{
                        label: 'Tỷ lệ hoàn thành và hủy đơn',
                        data: [data[0], data[1]], // Tỷ lệ % (thay số liệu thực tế ở đây)
                        backgroundColor: ['#4caf50', '#f44336'], // Màu sắc
                        hoverOffset: 4
                    }]
                };

                // Cấu hình biểu đồ 1
                const orderStatusConfig = {
                    type: 'pie',
                    data: orderStatusData,
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                callbacks: {
                                    label: (tooltipItem) => {
                                        const data = tooltipItem.raw;
                                        const total = tooltipItem.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = ((data / total) * 100).toFixed(2);
                                        return `${tooltipItem.label}: ${percentage}%`;
                                    }
                                }
                            },
                            datalabels: {
                                color: '#fff', // Màu chữ hiển thị
                                formatter: (value, context) => {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(2);
                                    return `${percentage}%`; // Hiển thị tỷ lệ phần trăm
                                },
                                font: {
                                    weight: 'bold',
                                    size: 12, // Kích thước chữ
                                }
                            }
                        }
                    },
                    plugins: [ChartDataLabels] // Kích hoạt plugin DataLabels
                };

                // Tạo biểu đồ 1
                const orderStatusChart = new Chart(
                    document.getElementById('orderStatusChart'),
                    orderStatusConfig
                );
            }
        });

        // Dữ liệu cho biểu đồ 2: Các phương thức mua hàng
        $.ajax({
            url: `http://localhost:8080/api/statistical/tiledonhang`,
            method: "GET",
            success: function (data) {
                // Dữ liệu cho biểu đồ 2: Các phương thức mua hàng
                const purchaseTypeData = {
                    labels: ['Mua hàng online', 'Mua hàng offline', 'Mua offline giao hàng'],
                    datasets: [{
                        label: 'Tỷ lệ các phương thức mua hàng',
                        data: [data[0], data[1], data[2]], // Tỷ lệ % (thay số liệu thực tế ở đây)
                        backgroundColor: ['#2196f3', '#ffc107', '#9c27b0'], // Màu sắc
                        hoverOffset: 4
                    }]
                };

                // Cấu hình biểu đồ 2
                const purchaseTypeConfig = {
                    type: 'pie',
                    data: purchaseTypeData,
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                callbacks: {
                                    label: (tooltipItem) => {
                                        const data = tooltipItem.raw;
                                        const total = tooltipItem.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = ((data / total) * 100).toFixed(2);
                                        return `${tooltipItem.label}: ${percentage}%`;
                                    }
                                }
                            },
                            datalabels: {
                                color: '#fff', // Màu chữ hiển thị trên biểu đồ
                                formatter: (value, context) => {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(2);
                                    return `${percentage}%`; // Hiển thị tỷ lệ phần trăm
                                },
                                font: {
                                    weight: 'bold',
                                    size: 12, // Kích thước chữ
                                }
                            }
                        }
                    },
                    plugins: [ChartDataLabels] // Kích hoạt plugin DataLabels
                };

                // Tạo biểu đồ 2
                const purchaseTypeChart = new Chart(
                    document.getElementById('purchaseTypeChart'),
                    purchaseTypeConfig
                );
            }
        });

        // bieu do top 5
        function bieuDOTop5() {
            let label = [];
            let dt = [];
            $.ajax({
                url: `http://localhost:8080/api/statistical/top5SP`,
                method: "GET",
                success: function (data) {
                    console.log(data)
                    data.forEach(item => {
                        label.push(item.productDetailName);
                        dt.push(item.totalQuantity);
                    })
                    console.log(label, dt)
                    const ctx = document.getElementById('topProductsChart').getContext('2d');
                    const topProductsChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: label, // Tên sản phẩm
                            datasets: [{
                                label: 'Số lượng bán ra',
                                data: dt, // Số lượng bán ra
                                backgroundColor: [
                                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'
                                ],
                                borderColor: [
                                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            indexAxis: 'y', // Biểu đồ cột nằm ngang
                            responsive: true,
                            scales: {
                                x: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Số lượng sản phẩm bán ra'
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'Tên sản phẩm'
                                    },
                                    ticks: {
                                        callback: function (value, index) {
                                            return label[index]; // Hiển thị tên sản phẩm
                                        }
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            return `${context.dataset.label}: ${context.raw}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            })
        }

        bieuDOTop5();
    </script>
