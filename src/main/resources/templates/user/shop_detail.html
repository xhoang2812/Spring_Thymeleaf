<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{user/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm chi tiết</title>
    <style>
        :root {
            --primary-color: #00234D;
            --secondary-color: #F76B6A;

            --btn-primary-border-radius: 0.25rem;
            --btn-primary-color: #fff;
            --btn-primary-background-color: #00234D;
            --btn-primary-border-color: #00234D;
            --btn-primary-hover-color: #fff;
            --btn-primary-background-hover-color: #00234D;
            --btn-primary-border-hover-color: #00234D;
            --btn-primary-font-weight: 500;

            --btn-secondary-border-radius: 0.25rem;
            --btn-secondary-color: #00234D;
            --btn-secondary-background-color: transparent;
            --btn-secondary-border-color: #00234D;
            --btn-secondary-hover-color: #fff;
            --btn-secondary-background-hover-color: #00234D;
            --btn-secondary-border-hover-color: #00234D;
            --btn-secondary-font-weight: 500;

            --heading-color: #000;
            --heading-font-family: 'Poppins', sans-serif;
            --heading-font-weight: 700;

            --title-color: #000;
            --title-font-family: 'Poppins', sans-serif;
            --title-font-weight: 400;

            --body-color: #000;
            --body-background-color: #fff;
            --body-font-family: 'Poppins', sans-serif;
            --body-font-size: 14px;
            --body-font-weight: 400;

            --section-heading-color: #000;
            --section-heading-font-family: 'Poppins', sans-serif;
            --section-heading-font-size: 48px;
            --section-heading-font-weight: 600;

            --section-subheading-color: #000;
            --section-subheading-font-family: 'Poppins', sans-serif;
            --section-subheading-font-size: 16px;
            --section-subheading-font-weight: 400;
        }
    </style>
    <link href="/user/productDetail/vendor.css" rel="stylesheet">
    <link href="/user/productDetail/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com/" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"
          rel="stylesheet">
</head>

<body layout:fragment="content">

<!-- Breadcrumb Section Begin -->
<section class="breadcrumb-option">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumb__text">
                    <h4>Sản phẩm</h4>
                    <div class="breadcrumb__links">
                        <a th:href="@{/home}">Trang chủ</a>
                        <a href="./shop.html">Sản phẩm</a>
                        <span>Sản phẩm chi tiết</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Breadcrumb Section End -->

<!-- Shop Details Section Begin -->
<main class="content-for-layout" id="MainContent">
    <div class="product-page mt-100">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 col-md-12 col-12">
                    <div class="product-gallery product-gallery-vertical d-flex">
                        <div class="product-img-large">
                            <div class="img-large-slider common-slider" data-slick='{
                                        "slidesToShow": 1,
                                        "slidesToScroll": 1,
                                        "dots": false,
                                        "arrows": false,
                                        "asNavFor": ".img-thumb-slider"
                                    }'>
                                <div class="img-large-wrapper">
                                    <a data-fancybox="gallery" href="" id="img11">
                                        <img alt="img" id="img1" src="">
                                    </a>
                                </div>
                                <div class="img-large-wrapper">
                                    <a data-fancybox="gallery" href="" id="img22">
                                        <img alt="img" id="img2" src="">
                                    </a>
                                </div>
                                <div class="img-large-wrapper">
                                    <a data-fancybox="gallery" href="" id="img33">
                                        <img alt="img" id="img3" src="">
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="product-img-thumb">
                            <div class="img-thumb-slider common-slider" data-slick='{
                                        "slidesToShow": 2,
                                        "slidesToScroll": 1,
                                        "dots": false,
                                        "arrows": true,
                                        "infinite": false,
                                        "speed": 300,
                                        "cssEase": "ease",
                                        "focusOnSelect": true,
                                        "swipeToSlide": true,
                                        "asNavFor": ".img-large-slider"
                                    }' data-vertical-slider="true">
                                <div>
                                    <div class="img-thumb-wrapper">
                                        <img alt="img" id="previewImg1" src="">
                                    </div>
                                </div>
                                <div>
                                    <div class="img-thumb-wrapper">
                                        <img alt="img" id="previewImg2" src="">
                                    </div>
                                </div>
                                <div>
                                    <div class="img-thumb-wrapper">
                                        <img alt="img" id="previewImg3" src="">
                                    </div>
                                </div>
                            </div>
                            <div class="activate-arrows show-arrows-always arrows-white d-none d-lg-flex justify-content-between mt-3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12 col-12">
                    <div class="product-details ps-lg-4">
                        <form class="product-form" th:action="@{/home/buy-now}" th:method="POST">
                            <div class="mb-3" th:id="coGiamGiaKo">
                                <span class="product-availability">Giảm giá</span>
                            </div>
                            <h2 class="product-title mb-3" th:utext="${productResponse.productName}"></h2>
                            <div class="product-price-wrapper mb-4">
                                <span class="product-price regular-price" style="color: red;"
                                      th:id="idProductDetailSalePrice"></span>
                                <input name="salePrice" th:id="idProductDetailSalePriceAn" type="hidden">
                                <span class="product-price regular-price" th:id="idProductDetailPrice"></span>
                                <input name="price" th:id="idProductDetailPriceAn" type="hidden">
                            </div>
                            <div class="product-sku product-meta mb-1">
                                <strong class="label">Số lượng kho:</strong>
                                <p th:id="idProductDetailQuantity"></p>
                                <input id="productDetailQuantityValue" type="hidden"/>
                            </div>
                            <!--                            <div class="product-sku product-meta mb-1" th:id="divSaleQuantity">-->
                            <!--                                <strong class="label">Số lượng khuyến mãi:</strong>-->
                            <!--                                <p th:id="idProductDetailSaleQuantity"></p>-->
                            <!--                                <input type="hidden" id="productDetailSaleQuantityValue"/>-->
                            <!--                            </div>-->
                            <div class="product-vendor product-meta mb-3">
                                <strong class="label">Trọng lượng</strong>
                                <p th:id="idProductDetailWeight"></p>
                                <input id="idProductDetail" name="idProductDetail1" type="hidden">
                            </div>

                            <div class="product-variant-wrapper">
                                <div class="product-variant product-variant-other">
                                    <strong class="label mb-1 d-block">Màu sắc:</strong>
                                    <ul class="variant-list list-unstyled d-flex align-items-center flex-wrap">
                                        <li class="variant-item">
                                            <select class="form-select" id="selectColor" name="idColor">
                                                <option th:each="listColor, stat : ${colors}"
                                                        th:utext="${listColor.name}"
                                                        th:value="${listColor.id}"></option>
                                            </select>
                                        </li>
                                    </ul>
                                </div>

                                <div class="product-variant product-variant-other">
                                    <strong class="label mb-1 d-block">Kích cỡ:</strong>
                                    <ul class="variant-list list-unstyled d-flex align-items-center flex-wrap">
                                        <li class="variant-item">
                                            <select class="form-select" id="selectId" name="idSize">
                                                <option th:each="listSize, stat : ${sizes}" th:utext="${listSize.name}"
                                                        th:value="${listSize.id}"></option>
                                            </select>
                                        </li>
                                    </ul>
                                </div>
                                <input id="idProductResponse" name="idProduct" th:value="${productResponse.productID}"
                                       type="hidden">
                            </div>

                            <div class="misc d-flex align-items-end justify-content-between mt-4">
                                <div class="quantity d-flex align-items-center justify-content-between">
                                    <button class="qty-btn dec-qty" type="button"><img
                                            alt="minus"
                                            src="/user/productDetail/minus.svg"></button>
                                    <input class="qty-input" id="quantity" name="quantity" oninput="validateInputSL()"
                                           type="number"
                                           value="1">
                                    <button class="qty-btn inc-qty" type="button"><img
                                            alt="plus" src="/user/productDetail/plus.svg">
                                    </button>
                                </div>
                                <div class="message-popup d-flex align-items-center">
                                        <span class="message-popup-icon">
                                            <svg fill="none" height="25" viewBox="0 0 24 25" width="24"
                                                 xmlns="http://www.w3.org/2000/svg">
                                            <path d="M1.5 4.25V16.25H4.5V20.0703L5.71875 19.0859L9.25781 16.25H16.5V4.25H1.5ZM3 5.75H15V14.75H8.74219L8.53125 14.9141L6 16.9297V14.75H3V5.75ZM18 7.25V8.75H21V17.75H18V19.9297L15.2578 17.75H9.63281L7.75781 19.25H14.7422L19.5 23.0703V19.25H22.5V7.25H18Z"
                                                  fill="black"/>
                                        </svg>
                                        </span>
                                </div>
                            </div>
                            <div class="product-form-buttons d-flex align-items-center justify-content-between mt-4">
                                <button class="position-relative btn-atc btn-add-to-cart" id="addToCart"
                                        sec:authorize="isAuthenticated()" type="button">
                                    Thêm vào giỏ hàng
                                </button>
                                <button class="position-relative btn-atc btn-add-to-cart" id="addToCartKoDangNhap"
                                        onclick="addCartKoDangNhap()"
                                        sec:authorize="isAnonymous()" type="button">
                                    Thêm vào giỏ hàng
                                </button>
                                <a class="product-wishlist">
                                    <svg class="icon icon-wishlist" fill="none" height="22" viewBox="0 0 26 22"
                                         width="26" xmlns="http://www.w3.org/2000/svg">

                                              fill="#00234D"></path>
                                    </svg>
                                </a>
                            </div>
                            <div class="buy-it-now-btn mt-2">
                                <button class="position-relative btn-atc btn-buyit-now"
                                        sec:authorize="isAuthenticated()"
                                        type="submit">Mua Ngay
                                </button>
                                <button class="position-relative btn-atc btn-buyit-now" onclick="thanhToanKoDangNhap()"
                                        sec:authorize="isAnonymous()"
                                        type="button">Mua Ngay
                                </button>
                            </div>
                        </form>

<script>

    $(document).ready(function () {
        changeAttribute();

    function addCartKoDangNhap() {
        try {
            const idSpct = document.getElementById('idProductDetail').value;
            const soluong = document.getElementById('quantity').value;
            let soLuongMax = document.getElementById('productDetailQuantityValue').value;
            let productDetailQuantityKho = document.getElementById('productDetailQuantityValue').value;
            if (isNaN(idSpct)) {
                showError("ID sản phẩm không hợp lệ!");
                console.error("ID sản phẩm không hợp lệ:", idSpct);
                return;
            }
            if (Number(productDetailQuantityKho) === 0) {
                showError("Sản phẩm đã hết hàng! Vui lòng chọn sản phẩm khác");
                return;
            }
            $.ajax(
                {
                    url: '/home/api/add-to-cart-without-login',
                    type: 'GET',
                    data: {
                        idSpct: idSpct,
                    },
                    success: function (data) {
                        const obj = {
                            "idSpct": idSpct,
                            "soLuong": soluong
                        };

                        let itemCart = localStorage.getItem("itemCart");
                        if (itemCart == null) {
                            // Nếu giỏ hàng chưa tồn tại, tạo mới và thêm sản phẩm
                            const arr = [obj];
                            localStorage.setItem("itemCart", JSON.stringify(arr));
                            showSuccesss("Thêm giỏ hàng thành công");
                            return;
                        }

                        // Nếu giỏ hàng đã tồn tại, kiểm tra sản phẩm
                        const list = JSON.parse(itemCart);
                        let found = false;

                        for (let i = 0; i < list.length; i++) {
                            if (list[i].idSpct === idSpct) {
                                // Tăng số lượng nếu sản phẩm đã tồn tại
                                list[i].soLuong = parseInt(list[i].soLuong) + parseInt(soluong);
                                if (list[i].soLuong > soLuongMax) {
                                    showError("Số lượng sản phẩm trong giỏ hàng vượt quá số lượng tồn kho!");
                                    return;
                                }
                                found = true;
                                break;
                            }
                        }

                        if (!found) {
                            // Nếu sản phẩm chưa tồn tại, thêm mới
                            list.push(obj);
                        }

                        localStorage.setItem("itemCart", JSON.stringify(list));
                        showSuccesss("Thêm giỏ hàng thành công");
                    },
                    error: function (xhr) {
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            showError(xhr.responseJSON.error);
                        } else {
                            console.log("Lỗi backend");
                        }
                        return;
                    }
                }
            );
        } catch (error) {
            console.error("Lỗi khi thêm vào giỏ hàng:", error);
            toastr.error("Có lỗi xảy ra khi thêm sản phẩm vào giỏ hàng. Vui lòng thử lại!");
        }
    }

    async function thanhToanKoDangNhap() {
        const idSpct = document.getElementById('idProductDetail').value;
        const soluong = document.getElementById('quantity').value;
        let soLuongMax = document.getElementById('productDetailQuantityValue').value;
        let productDetailQuantityKho = document.getElementById('productDetailQuantityValue').value;
        if (isNaN(idSpct)) {
            showError("ID sản phẩm không hợp lệ!");
            console.error("ID sản phẩm không hợp lệ:", idSpct);
            return;
        }
        if (Number(productDetailQuantityKho) === 0) {
            showError("Sản phẩm đã hết hàng! Vui lòng chọn sản phẩm khác");
            return;
        }


        const obj = {
            "idSpct": idSpct,
            "soLuong": soluong
        };

        let itemCart = localStorage.getItem("itemCart");
        if (itemCart == null) {
            // Nếu giỏ hàng chưa tồn tại, tạo mới và thêm sản phẩm
            const arr = [obj];
            localStorage.setItem("itemCart", JSON.stringify(arr));
            showSuccesss("Thêm giỏ hàng thành công");
            return;
        }

        // Nếu giỏ hàng đã tồn tại, kiểm tra sản phẩm
        const list = JSON.parse(itemCart);
        let found = false;

        for (let i = 0; i < list.length; i++) {
            if (list[i].idSpct === idSpct) {
                // Tăng số lượng nếu sản phẩm đã tồn tại
                list[i].soLuong = parseInt(list[i].soLuong) + parseInt(soluong);
                found = true;
                break;
            }
        }

        if (!found) {
            // Nếu sản phẩm chưa tồn tại, thêm mới
            list.push(obj);
        }

        localStorage.setItem("itemCart", JSON.stringify(list));
        console.log(idSpct);
        console.log(soluong);
        window.location.href = `/home/check-out-without-login?selectedCartIds=${idSpct}&soLuong=${soluong}`;
    }


    $(".qty-btn").on('click', function () {
        var qtyInput = $(this).parent().find('input');
        let maxQuanity = parseInt($('#productDetailQuantityValue').val());
        let oldVal = parseInt(qtyInput.val());
        let newVal;
        if ($(this).hasClass('inc-qty')) {
            newVal = (oldVal < maxQuanity) ? oldVal + 1 : maxQuanity;
        } else if (qtyInput.val() >= 1) {
            if (oldVal > maxQuanity) {
                newVal = maxQuanity;
            } else if (oldVal === 1) {
                newVal = 1;
            } else if (oldVal > 1) {
                newVal = oldVal - 1;
            }
        }
        qtyInput.val(newVal);
    });

    function changeAttribute() {
        let selectedSize = $('select[name="idSize"]').val();
        let selectedColor = $('select[name="idColor"]').val();
        let productId = document.getElementById('idProductResponse').value;
        let productDetailPrice = document.getElementById('idProductDetailPrice');
        let productDetailQuantity = document.getElementById('idProductDetailQuantity');
        let productDetailQuantityValue = document.getElementById('productDetailQuantityValue');
        let productDetailSaleQuantity = document.getElementById('idProductDetailSaleQuantity');
        let productDetailWeight = document.getElementById('idProductDetailWeight');
        let productDetailSalePrice = document.getElementById('idProductDetailSalePrice');

    function validateInputSL() {
        let productDetailQuantity = document.getElementById('quantity').value;
        let productDetailQuantityKho = document.getElementById('productDetailQuantityValue').value;
        if (Number(productDetailQuantity) <= 0 || !Number.isInteger(Number(productDetailQuantity))) {
            showError("Số lượng không hợp lệ");
            $('#quantity').val(1);
            return false;
        }

        if (Number(productDetailQuantity) > Number(productDetailQuantityKho)) {
            showError("Số lượng vượt quá số lượng trong kho");
            $('#quantity').val(productDetailQuantityKho);
            return false;
        }
    }

    function addToCart() {
        let productDetailSalePriceId = document.getElementById('idProductDetail').value;
        let productDetailQuantity = document.getElementById('quantity').value;
        let productDetailQuantityKho = document.getElementById('productDetailQuantityValue').value;
        let productDetailSalePriceAn = document.getElementById('idProductDetailSalePriceAn').value;
        let productDetailPriceAn = document.getElementById('idProductDetailPriceAn').value;
        if (Number(productDetailQuantityKho) === 0) {
            showError("Sản phẩm đã hết hàng! Vui lòng chọn sản phẩm khác");
            return;
        }

        if (Number(productDetailQuantity) <= 0 || !Number.isInteger(Number(productDetailQuantity))) {
            showError("Số lượng không hợp lệ");
            return;
        }

        if (Number(productDetailQuantity) > Number(productDetailQuantityKho)) {
            showError("Số lượng vượt quá số lượng trong kho");
            return;
        }

        $.ajax({
            url: '/home/api/add-to-cart',
            type: 'POST',
            data: {
                idProductDetail: productDetailSalePriceId,
                quantity: productDetailQuantity,
                price: productDetailPriceAn,
                salePrice: productDetailSalePriceAn
            },
            success: function (data) {
                showSuccesss("Thêm vào giỏ hàng thành công")
                console.log(data)
            },
            error: function (xhr) {
                if (xhr.responseJSON && xhr.responseJSON.error) {
                    showError(xhr.responseJSON.error);
                } else {
                    console.log("Lỗi backend");
                }
            }
        })
    }

    function showSuccesss(messsages1) {
        const Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 1000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.onmouseenter = Swal.stopTimer;
                toast.onmouseleave = Swal.resumeTimer;
            }
        });
        Toast.fire({
            icon: "success",
            title: messsages1
        });
    }

    function showError(messsages1) {
        const Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 2500,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.onmouseenter = Swal.stopTimer;
                toast.onmouseleave = Swal.resumeTimer;
            }
        });
        Toast.fire({
            icon: "error",
            title: messsages1
        });
    }


    [[${spctInactive} == true]] ? showError("Sản phẩm bạn chọn mua đã tạm dừng kinh doanh ") : "";
    [[${quaSl} == true]] ? showError("Sản phẩm bạn chọn mua quá số lượng có kho") : "";
    [[${hetSl} == true]] ? showError("Sản phẩm bạn chọn mua đã hết số lượng có kho") : "";
</script>
