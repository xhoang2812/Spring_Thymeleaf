<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{user/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cảm ơn quý khách</title>
</head>
<body layout:fragment="content">

<div style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f4ff;">
    <div class="row">
        <div class="col-12" style="background-color: #f0f7ff; width: 100%; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);">
            <img alt="Heart in hand illustration" src="/user/img/image-17308801310272.png"
                 style="height: 150px; width: auto; margin-bottom: 20px;">
            <div style="font-size: 40px; font-weight: bold; color: #1a1a1a; margin-bottom: 10px;">Cảm ơn vì bạn đã đặt
                hàng
            </div>
            <div style="font-size: 16px; color: #555; margin-bottom: 20px;">
                Đơn hàng của quý khách đã được thanh toán thành công và đang được xử lý.
                F6 STORE sẽ thông báo cho quý khách khi đơn hàng được giao.
            </div>
            <a th:href="@{/home}"
               style="display: inline-block; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #fff; background-color: #040505; border: none; border-radius: 8px; text-decoration: none; cursor: pointer;">
                Quay lại mua hàng</a>
            <a sec:authorize="isAuthenticated()"  th:href="@{/home/customer-bill-management}"
               style="display: inline-block; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #fff; background-color: #111111; border: none; border-radius: 8px; text-decoration: none; cursor: pointer;">
                Xem hóa đơn của bạn</a>
        </div>

        <div class="col-12" style="display: flex; justify-content: space-around; align-items: center; border-radius: 8px; padding: 10px; margin-top: 10px;">
            <div style="text-align: center; color: #007bff;">
                <div style="font-size: 24px;">
                    <img alt="" src="/user/img/image-17308801310273.png" style="width: 30px; height: 30px;">
                </div>
                <div>Xác nhận mua</div>
            </div>
            <div style="width: 50px; border-top: 2px dashed #007bff;"></div>
            <div style="text-align: center; color: #000;">
                <div style="font-size: 24px;">
                    <img alt="" src="/user/img/image-17308801310274.png" style="width: 30px; height: 30px;">
                </div>
                <div>Vận chuyển</div>
            </div>
            <div style="width: 50px; border-top: 2px dashed #ccc;"></div>
            <div style="text-align: center; color: #000;">
                <div style="font-size: 24px;">
                    <img alt="" src="/user/img/image-17308801310275.png" style="width: 30px; height: 30px;">
                </div>
                <div>Chở tới nơi </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
