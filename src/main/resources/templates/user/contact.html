<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{user/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body layout:fragment="content">
<!-- Map Begin -->
<div class="map">
    <iframe allowfullscreen=""
            aria-hidden="false" height="500"
            src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d5067.436223180912!2d105.83673904606478!3d21.036980404016834!3m2!1i1024!2i768!4f13.1!5e0!3m2!1svi!2s!4v1729607115219!5m2!1svi!2s"
            style="border:0;" tabindex="0">
    </iframe>
</div>
<!-- Map End -->

<!-- Contact Section Begin -->
<section class="contact spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-6">
                <div class="contact__text">
                    <div class="section-title">
                        <span>Information</span>
                        <h2>Contact Us</h2>
                        <p>As you might expect of a company that began as a high-end interiors contractor, we pay
                            strict attention.</p>
                    </div>
                    <ul>
                        <li>
                            <h4>America</h4>
                            <p>195 E Parker Square Dr, Parker, CO 801 <br/>+43 982-314-0958</p>
                        </li>
                        <li>
                            <h4>France</h4>
                            <p>109 Avenue Léon, 63 Clermont-Ferrand <br/>+12 345-423-9893</p>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-lg-6 col-md-6">
                <div class="contact__form">
                    <form action="#">
                        <div class="row">
                            <div class="col-lg-6">

                                    <input placeholder="Name" type="text">

                            </div>
                            <div class="col-lg-6">

                                    <input placeholder="Email" type="text">

                            </div>
                            <div class="col-lg-12">

                                    <textarea placeholder="Message"></textarea>

                                <button class="site-btn" type="submit">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Contact Section End -->
</body>
</html>
