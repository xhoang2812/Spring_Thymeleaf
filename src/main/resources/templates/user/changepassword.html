<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{user/index}"
      xmlns:layout="http://www.utralq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi Mật Khẩu</title>
    <style>
        .profile-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .profile-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .change-password-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            margin-right: 30px;
        }

        .change-password-form h3 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .change-password-form p {
            color: #888;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn-save {
            background-color: #ff4d4f;
            color: #fff;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100px;
        }

        .btn-back {
            background-color: #6c757d;
            color: #fff;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100px;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function showErrors(messages) {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            Toast.fire({
                icon: "error",
                title: messages
            });
        }

        function validateChangePassword(event) {
            event.preventDefault();

            // Hiển thị hộp thoại xác nhận trước khi thực hiện lưu
            Swal.fire({
                title: 'Bạn có chắc muốn đổi mật khẩu?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3f3f',
                cancelButtonColor: '#47434c',
                confirmButtonText: 'Thay đổi ngay!',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {

                    const currentPassword = document.getElementById('currentPassword').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    if (!currentPassword) {
                        showErrors("Vui lòng nhập mật khẩu hiện tại");
                        return;
                    }

                    if (!newPassword) {
                        showErrors("Vui lòng nhập mật khẩu mới");
                        return;
                    }

                    if (newPassword !== confirmPassword) {
                        showErrors("Mật khẩu xác nhận không khớp");
                        return;
                    }

                    // Gửi yêu cầu POST với đúng tên tham số trong body
                    axios.post('/home/change-password', {
                        currentPassword: currentPassword,
                        newPassword: newPassword
                    }).then(response => {
                        // Nếu yêu cầu thành công, hiển thị thông báo thành công
                        Swal.fire({
                            title: "Thành công",
                            text: "Mật khẩu đã được thay đổi!",
                            icon: "success",
                            timer: 2500,
                            showConfirmButton: false
                        }).then(() => window.location.reload());
                    }).catch(error => {
                        // Xử lý lỗi từ server nếu có
                        if (error.response && error.response.data) {
                            showErrors(error.response.data || "Đổi mật khẩu thất bại");
                        } else {
                            showErrors("Đã có lỗi xảy ra. Vui lòng thử lại.");
                        }
                    });
                }
            });
        }
    </script>
</head>
<body layout:fragment="content">
<section class="profile-container">
    <form th:action="@{/home/change-password}" method="post" id="changePasswordForm">
        <div class="change-password-form">
            <h3>Đổi Mật Khẩu</h3>
            <p>Thay đổi mật khẩu để bảo vệ tài khoản của bạn.</p>

            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input type="password" id="currentPassword" name="currentPassword" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div style="display: flex; justify-content: flex-start; gap: 10px;">
                <button type="button" class="btn-save" onclick="validateChangePassword(event)">Lưu</button>
                <a th:href="@{/home}" class="btn-back" style="text-align: center; text-decoration: none;">Quay lại</a>
            </div>
        </div>
    </form>
</section>
</body>
</html>
